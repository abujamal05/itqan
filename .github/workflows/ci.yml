# Every defect found in the last debugging pass — a broken import path, five
# unwired exports, a type collision, a stale rename — was catchable by a
# machine. None of them were caught, because nothing ran automatically. This is
# that gate.
#
# Two jobs on purpose. `checks` is the fast one (~1 min) and blocks the merge;
# `e2e` is the slow one (~3 min) and runs in parallel rather than behind it, so
# a type error is reported in a minute instead of four.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in progress — no point finishing CI for a commit
# that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Onboarding/package-lock.json
            itqan-website/package-lock.json

      - name: Install (app)
        working-directory: Onboarding
        run: npm ci

      - name: Install (site)
        working-directory: itqan-website
        run: npm ci

      # `tsc -b` is the check that would have caught the Confidence collision
      # and the stale startAnalysis call.
      - name: Typecheck
        working-directory: Onboarding
        run: npx tsc -b --pretty false

      - name: Lint
        working-directory: Onboarding
        run: npx oxlint src dev e2e scripts

      - name: Build site
        working-directory: itqan-website
        run: npm run build

      - name: Build app
        working-directory: Onboarding
        run: npm run build

      # The locked rule set: colour, brand, RTL, a11y, states, motion, copy.
      - name: Itqan audit (phase gate)
        working-directory: itqan-website
        run: python scripts/audit.py src/

      # Arabic and English must stay at exactly equal keys. A missing key is a
      # user-visible raw string like "dash.readinessUnknown", and it is trivial
      # to introduce and easy to miss in review.
      - name: i18n parity
        working-directory: Onboarding
        run: |
          node -e "
          const fs = require('fs');
          const ar = Object.keys(JSON.parse(fs.readFileSync('src/i18n/ar.json','utf8'))).sort();
          const en = Object.keys(JSON.parse(fs.readFileSync('src/i18n/en.json','utf8'))).sort();
          const onlyAr = ar.filter(k => !en.includes(k));
          const onlyEn = en.filter(k => !ar.includes(k));
          if (onlyAr.length || onlyEn.length) {
            console.error('i18n key mismatch');
            if (onlyAr.length) console.error('  only in ar:', onlyAr.join(', '));
            if (onlyEn.length) console.error('  only in en:', onlyEn.join(', '));
            process.exit(1);
          }
          console.log('i18n parity OK (' + ar.length + ' keys)');
          "

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Onboarding/package-lock.json

      - name: Install (app)
        working-directory: Onboarding
        run: npm ci

      - name: Install (site)
        working-directory: itqan-website
        run: npm ci

      # --with-deps pulls the system libraries the browsers need on a bare
      # runner; without it WebKit fails to launch with a missing-.so error.
      - name: Install browsers
        working-directory: Onboarding
        run: npx playwright install --with-deps chromium firefox webkit

      # Firefox is auto-skipped locally when its binary cannot launch (some
      # Windows sandboxes). On CI it always can, so require it — that is the
      # whole point of having the lane.
      - name: Run E2E
        working-directory: Onboarding
        env:
          CI: 'true'
          E2E_FORCE_FIREFOX: '1'
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Onboarding/playwright-report/
          retention-days: 7
